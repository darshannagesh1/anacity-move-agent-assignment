# Local development: the app plus its own Postgres.
# OPENAI_API_KEY and OPENAI_MODEL are read from a .env file next to this one.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anacity
      POSTGRES_PASSWORD: anacity
      POSTGRES_DB: anacity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anacity -d anacity"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://anacity:anacity@postgres:5432/anacity
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the .env file next to docker-compose.yml}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
